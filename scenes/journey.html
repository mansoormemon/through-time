<section class="scene journey-scene">
  <header class="journey-header">
    <div class="title-group">
      <h1>Through Time</h1>
      <p>
        Explore the evolution of the global economic divide from 1952 to 2007.
        Discover how countries changed over time through industrial growth,
        globalization, economic crises, and major historical events that shaped
        the distribution of wealth across the world.
      </p>
    </div>
  </header>

  <div class="timeline">
    <div class="timeline-header">
      <h2>Timeline</h2>
    </div>

    <div id="timeline-track-controls">
      <button
        id="timeline-prev"
        class="timeline-control"
        aria-label="Previous year"
      >
        🢐
      </button>
      <div id="timeline-track"></div>
      <button
        id="timeline-next"
        class="timeline-control"
        aria-label="Next year"
      >
        🢒
      </button>
    </div>
  </div>

  <div class="journey-content">
    <div class="map-container">
      <div id="world-map"></div>
    </div>
    <aside class="story-panel">
      <h2 id="story-headline"></h2>
      <div id="story-paras"></div>
      <div id="story-tags" class="tags"></div>
    </aside>
  </div>
</section>
